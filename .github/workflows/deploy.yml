# Builds the app and publishes it to GitHub Pages on every push to main.
# Needs: Settings → Pages → Source: "GitHub Actions", and a repository *variable* (not secret)
# VITE_GOOGLE_CLIENT_ID holding the public Google OAuth Client ID.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check the Google Client ID variable
        env:
          ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
        run: |
          if [ -z "$ID" ]; then
            echo "::warning::VITE_GOOGLE_CLIENT_ID is not set: the site will work in browser-only mode."
          elif ! echo "$ID" | grep -Eq '^[0-9]+-[a-z0-9]+\.apps\.googleusercontent\.com$'; then
            echo "::error::VITE_GOOGLE_CLIENT_ID must be only the Client ID (like 123-abc.apps.googleusercontent.com), without the name, '=', quotes or spaces."
            exit 1
          fi
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
